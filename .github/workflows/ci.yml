name: gates

on:
  push:
  pull_request:

jobs:
  gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo check -p eba-rs --no-default-features
      - run: cargo check -p eba-rs-infra --no-default-features
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      - run: cargo doc --workspace --no-deps
        env:
          RUSTDOCFLAGS: "-D warnings"
      - run: |
          for file in eba-rs/examples/*.rs; do
            cargo run --quiet --example "$(basename "$file" .rs)" -p eba-rs
          done
          for file in eba-rs-infra/examples/*.rs; do
            cargo run --quiet --example "$(basename "$file" .rs)" -p eba-rs-infra
          done
