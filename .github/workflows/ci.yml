name: gates

on:
  push:
  pull_request:

jobs:
  gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo check -p eba-rs --no-default-features
      - run: cargo check -p eba-rs-infra --no-default-features
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      - run: cargo doc --workspace --no-deps
        env:
          RUSTDOCFLAGS: "-D warnings"
      # examples/ 已于 2026-11 撤走；共享语义由 monorepo 的 conformance fixture 承载。
      # （conformance.rs 在 cargo test 中已跑，见上面 test --workspace。）
