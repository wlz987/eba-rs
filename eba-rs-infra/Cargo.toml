[package]
name = "eba-rs-infra"
version = "0.6.6"
edition = "2021"
description = "EBA 的 no_std/alloc 核心；drive feature 提供 tokio Drive"
keywords = ["runtime", "actor", "message", "no-std"]
categories = ["concurrency", "no-std"]
license = "MIT"
readme = "README.md"
repository = "https://github.com/wlz987/eba-rs"
homepage = "https://github.com/wlz987/eba-rs"

[features]
default = ["std", "uuid"]
std = []
uuid = ["dep:uuid", "std"]
drive = ["std", "dep:tokio"]

[dependencies]
spin = "0.9"
tokio = { version = "1", features = ["rt", "sync", "time", "macros"], optional = true }
uuid = { version = "1", features = ["v4"], optional = true }

[lints]
workspace = true
